<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- GOOGLE SEARCH CONSOLE VERIFICATION -->
    <meta name="google-site-verification" content="Vg04eiXL_lLorBc0wVkC8daYYD8F85FzUhJpKdXf29k" />

    <!-- SEO Implementation -->
    <title>PromptMaster Pro | Premium AI Prompt Engineering Tool</title>
    <meta name="description" content="Generate high-quality AI prompts for ChatGPT, Midjourney, and Coding. Professional AI prompt builder for expert results.">
    <meta name="keywords" content="AI Prompt Generator, Best ChatGPT Prompts, Midjourney Prompt Helper, Free AI Prompts">
    <link rel="canonical" href="https://prompt-genie-pro.vercel.app" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f8fafc; overflow-x: hidden; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .active-model { border: 2px solid #3b82f6 !important; background: rgba(59, 130, 246, 0.1) !important; box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); }
        .ad-container { background: rgba(255, 255, 255, 0.02); border-radius: 16px; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 1px solid rgba(255, 255, 255, 0.05); }
        html { scroll-behavior: smooth; }
        .app-grid { display: grid; grid-template-columns: 1fr 300px; gap: 24px; }
        @media (max-width: 1024px) { .app-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="selection:bg-blue-500/30">

    <!-- LIMIT REACHED MODAL -->
    <div id="adModal" class="hidden fixed inset-0 z-[9999] bg-slate-950/90 backdrop-blur-xl flex items-center justify-center p-6">
        <div class="glass p-10 rounded-[2.5rem] max-w-sm w-full text-center border-blue-500/20 shadow-2xl">
            <h2 class="text-2xl font-black mb-2">Limit Reached</h2>
            <p class="text-slate-400 text-sm mb-8">Daily free 10 prompts are over. Click below to unlock **10 MORE** instantly.</p>
            <button onclick="watchAdToUnlock()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold text-lg mb-4 shadow-xl shadow-blue-600/30 transition-all active:scale-95">
                UNLOCK NOW ✨
            </button>
            <button onclick="closeModal()" class="text-slate-500 text-xs">Cancel</button>
        </div>
    </div>

    <!-- NAVBAR -->
    <nav class="sticky top-0 z-50 border-b border-white/5 bg-slate-950/80 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-xl font-black tracking-tighter uppercase">PromptMaster<span class="text-blue-500">.pro</span></span>
            </div>
            <div class="bg-slate-900 border border-white/10 px-4 py-2 rounded-full">
                <span class="text-xs font-bold text-slate-400">TOKENS: <span id="remCount" class="text-white">10</span></span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">
        
        <!-- TOP AD SLOT -->
        <div class="ad-container mb-12 min-h-[90px]">
            <iframe sandbox="allow-scripts allow-popups allow-same-origin" style="width:728px; height:90px; border:none;" srcdoc="
                <body style='margin:0; display:flex; justify-content:center;'>
                    <script type='text/javascript'>atOptions = {'key' : 'fea6acbdcf0fdca6a97f3460a737e593','format' : 'iframe','height' : 90,'width' : 728,'params' : {}};</script>
                    <script type='text/javascript' src='https://www.highperformanceformat.com/fea6acbdcf0fdca6a97f3460a737e593/invoke.js'></script>
                </body>"></iframe>
        </div>

        <div class="app-grid">
            <div class="space-y-8">
                <header>
                    <h1 class="text-4xl md:text-6xl font-black tracking-tight mb-4 leading-none">AI Master <span class="text-blue-500">Prompts.</span></h1>
                    <p class="text-slate-400">Professional tool for ChatGPT, Midjourney, and Coding prompts.</p>
                </header>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <button onclick="setCat('chatgpt')" id="card-chatgpt" class="glass p-6 rounded-3xl text-left active-model transition-all">
                        <span class="font-bold text-sm">ChatGPT-4</span>
                    </button>
                    <button onclick="setCat('midjourney')" id="card-midjourney" class="glass p-6 rounded-3xl text-left transition-all">
                        <span class="font-bold text-sm">AI Art</span>
                    </button>
                    <button onclick="setCat('coding')" id="card-coding" class="glass p-6 rounded-3xl text-left transition-all">
                        <span class="font-bold text-sm">Coding</span>
                    </button>
                    <button onclick="setCat('marketing')" id="card-marketing" class="glass p-6 rounded-3xl text-left transition-all">
                        <span class="font-bold text-sm">Marketing</span>
                    </button>
                </div>

                <div class="glass p-1 rounded-[2.5rem] relative">
                    <textarea id="userInput" placeholder="Type your idea here..." class="w-full h-56 bg-transparent p-10 text-2xl outline-none resize-none"></textarea>
                    <div class="p-6 border-t border-white/5 flex justify-end">
                        <button onclick="generate()" class="bg-blue-600 hover:bg-blue-500 text-white px-10 py-4 rounded-2xl font-black transition-all active:scale-95">GENERATE ✨</button>
                    </div>
                </div>

                <div id="resultBox" class="hidden bg-blue-600/5 border border-blue-500/20 p-10 rounded-[3rem]">
                    <div id="output" class="text-xl text-slate-200 leading-relaxed italic mb-6"></div>
                    <button onclick="copyText()" class="text-xs font-bold text-blue-500 uppercase tracking-widest">Copy Result</button>
                </div>
            </div>

            <aside class="space-y-6">
                <div class="ad-container h-[250px] w-full">
                    <span class="text-[10px] text-slate-700 font-bold">SIDEBAR AD UNIT</span>
                </div>
            </aside>
        </div>
    </main>

    <script>
        const MY_DIRECT_LINK = "https://www.effectivegatecpm.com/hx9eqwb2?key=eca9ef1a642f0854c04b34a426523a34";
        let currentCat = 'chatgpt';
        let userLimits = JSON.parse(localStorage.getItem('user_limits_verified')) || {
            date: new Date().toLocaleDateString(), chatgpt: 0, midjourney: 0, coding: 0, marketing: 0
        };

        function setCat(cat) {
            currentCat = cat;
            document.querySelectorAll('button[id^="card-"]').forEach(btn => btn.classList.remove('active-model'));
            document.getElementById('card-' + cat).classList.add('active-model');
            updateUI();
        }

        function updateUI() { document.getElementById('remCount').innerText = 10 - userLimits[currentCat]; }

        function generate() {
            if(userLimits[currentCat] >= 10) { document.getElementById('adModal').classList.remove('hidden'); return; }
            const input = document.getElementById('userInput').value;
            if(!input) return;

            document.getElementById('output').innerText = `[EXPERT ${currentCat.toUpperCase()} ENGINEER]: ${input}. Optimize this with professional persona and technical constraints.`;
            document.getElementById('resultBox').classList.remove('hidden');
            
            userLimits[currentCat]++;
            localStorage.setItem('user_limits_verified', JSON.stringify(userLimits));
            updateUI();
        }

        function watchAdToUnlock() {
            window.open(MY_DIRECT_LINK, '_blank'); 
            userLimits[currentCat] = 0;
            localStorage.setItem('user_limits_verified', JSON.stringify(userLimits));
            document.getElementById('adModal').classList.add('hidden');
            updateUI();
        }

        function closeModal() { document.getElementById('adModal').classList.add('hidden'); }
        function copyText() { navigator.clipboard.writeText(document.getElementById('output').innerText); alert("Copied!"); }
    </script>
</body>
</html>
