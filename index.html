<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptMaster Pro | AI Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: white; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .active-card { border-color: #3b82f6 !important; background: rgba(59, 130, 246, 0.1) !important; }
        #adModal { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; padding: 20px; }
        
        /* Responsive Ad Container */
        .ad-banner-wrapper { 
            width: 100%; 
            display: flex; 
            justify-content: center; 
            margin-bottom: 2rem; 
            min-height: 90px; 
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- REWARD MODAL -->
    <div id="adModal">
        <div class="glass p-10 rounded-[2rem] max-w-md w-full text-center border-blue-500/30">
            <h2 class="text-2xl font-bold mb-4 text-blue-400">Limit Reached!</h2>
            <p class="text-slate-400 mb-8">Click unlock to watch an ad and get **10 more** prompts.</p>
            <button onclick="watchAdToUnlock()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold text-lg mb-4 shadow-xl shadow-blue-600/20">
                UNLOCK NOW ✨
            </button>
            <button onclick="closeModal()" class="text-slate-500 text-sm">Cancel</button>
        </div>
    </div>

    <!-- NAVBAR -->
    <nav class="border-b border-white/5 p-4 flex justify-between items-center bg-slate-950/80 sticky top-0 z-50">
        <div class="text-xl font-black italic tracking-tighter">PromptMaster<span class="text-blue-500">.pro</span></div>
        <div class="text-xs bg-slate-900 px-4 py-2 rounded-full border border-white/10 font-bold">
            <span id="activeCat">ChatGPT</span>: <span id="remCount" class="text-blue-500">10</span> Left
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-10">
        
        <!-- FIX: BANNER AD (Direct Script - No Iframe for better loading) -->
        <div class="ad-banner-wrapper">
            <div id="ad-container-728">
                <!-- Aapka Script Yahan Hai -->
                <script type="text/javascript">
                    atOptions = {
                        'key' : 'fea6acbdcf0fdca6a97f3460a737e593',
                        'format' : 'iframe',
                        'height' : 90,
                        'width' : 728,
                        'params' : {}
                    };
                </script>
                <script type="text/javascript" src="//www.highperformanceformat.com/fea6acbdcf0fdca6a97f3460a737e593/invoke.js"></script>
            </div>
        </div>

        <h1 class="text-4xl font-extrabold text-center mb-10 leading-tight tracking-tight">AI Prompt <span class="text-blue-500 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">Master</span></h1>

        <!-- CATEGORIES -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-10 text-center">
            <div onclick="setCat('chatgpt')" id="card-chatgpt" class="glass p-5 rounded-2xl cursor-pointer active-card font-bold">ChatGPT</div>
            <div onclick="setCat('midjourney')" id="card-midjourney" class="glass p-5 rounded-2xl cursor-pointer font-bold">Images</div>
            <div onclick="setCat('coding')" id="card-coding" class="glass p-5 rounded-2xl cursor-pointer font-bold">Coding</div>
            <div onclick="setCat('marketing')" id="card-marketing" class="glass p-5 rounded-2xl cursor-pointer font-bold">Ads</div>
        </div>

        <!-- INPUT BOX -->
        <div class="glass p-2 rounded-[2.5rem] overflow-hidden mb-10 shadow-2xl">
            <textarea id="userInput" placeholder="Describe your idea here..." class="w-full h-44 bg-transparent p-8 text-xl outline-none resize-none"></textarea>
            <div class="p-6 bg-white/5 border-t border-white/5 flex justify-end">
                <button onclick="generate()" class="bg-blue-600 hover:bg-blue-500 text-white px-10 py-3 rounded-2xl font-bold transition transform active:scale-95 shadow-lg shadow-blue-600/20">
                    Generate ✨
                </button>
            </div>
        </div>

        <!-- RESULT -->
        <div id="resultBox" class="hidden glass p-8 rounded-[2rem] border-blue-500/20">
            <div id="output" class="text-lg text-slate-300 italic leading-relaxed mb-4"></div>
            <button onclick="copyText()" class="text-blue-500 font-bold text-sm uppercase">Copy Result</button>
        </div>
    </main>

    <script>
        const MY_DIRECT_LINK = "https://www.effectivegatecpm.com/hx9eqwb2?key=eca9ef1a642f0854c04b34a426523a34";

        let currentCat = 'chatgpt';
        let userLimits = JSON.parse(localStorage.getItem('user_limits_v4')) || {
            date: new Date().toLocaleDateString(),
            chatgpt: 0, midjourney: 0, coding: 0, marketing: 0
        };

        function setCat(cat) {
            currentCat = cat;
            document.querySelectorAll('[id^="card-"]').forEach(c => c.classList.remove('active-card'));
            document.getElementById('card-' + cat).classList.add('active-card');
            document.getElementById('remCount').innerText = 10 - userLimits[currentCat];
        }

        function generate() {
            if(userLimits[currentCat] >= 10) {
                document.getElementById('adModal').style.display = 'flex';
                return;
            }
            const input = document.getElementById('userInput').value;
            if(!input) return;

            document.getElementById('output').innerText = `[EXPERT ${currentCat.toUpperCase()}]: ${input}. (Optimized for maximum AI logic and clarity)`;
            document.getElementById('resultBox').classList.remove('hidden');

            userLimits[currentCat]++;
            localStorage.setItem('user_limits_v4', JSON.stringify(userLimits));
            document.getElementById('remCount').innerText = 10 - userLimits[currentCat];
        }

        function watchAdToUnlock() {
            window.open(MY_DIRECT_LINK, '_blank'); 
            userLimits[currentCat] = 0;
            localStorage.setItem('user_limits_v4', JSON.stringify(userLimits));
            document.getElementById('adModal').style.display = 'none';
            document.getElementById('remCount').innerText = 10;
        }

        function closeModal() { document.getElementById('adModal').style.display = 'none'; }
        function copyText() { navigator.clipboard.writeText(document.getElementById('output').innerText); alert("Copied!"); }
    </script>
</body>
</html>
