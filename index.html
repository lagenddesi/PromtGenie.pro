<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptMaster Pro | AI Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: white; overflow-x: hidden; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .active-card { border: 2px solid #3b82f6 !important; background: rgba(59, 130, 246, 0.1) !important; }
        
        /* AD SHIELD: Redirects rokne ke liye */
        .ad-wrapper {
            width: 100%;
            max-width: 728px;
            height: 90px;
            margin: 0 auto 2rem auto;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        /* Mobile par ad ko scale (chota) karne ke liye CSS */
        @media (max-width: 728px) {
            .ad-wrapper iframe {
                transform: scale(0.76); /* Mobile par size chota karega */
                transform-origin: center top;
            }
            .ad-wrapper { height: 50px; } /* Mobile height adjust */
        }

        #adModal { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body>

    <!-- REWARD MODAL -->
    <div id="adModal">
        <div class="glass p-10 rounded-[2.5rem] max-w-md w-full text-center border-blue-500/30">
            <h2 class="text-2xl font-bold mb-4 text-blue-400">Limit Reached!</h2>
            <p class="text-slate-400 mb-8">Daily 10 free prompts used. Click to unlock **10 more** for this session.</p>
            <button onclick="watchAdToUnlock()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold text-lg mb-4 shadow-lg shadow-blue-600/30 transition">
                WATCH AD & UNLOCK ✨
            </button>
            <button onclick="closeModal()" class="text-slate-500 text-sm">Maybe Later</button>
        </div>
    </div>

    <!-- NAVBAR -->
    <nav class="border-b border-white/5 p-4 flex justify-between items-center bg-slate-950/80 sticky top-0 z-50">
        <div class="text-xl font-black italic tracking-tight">PromptMaster<span class="text-blue-500">.pro</span></div>
        <div class="text-xs bg-slate-900 px-4 py-2 rounded-full border border-white/10 font-bold">
            <span id="activeCat">ChatGPT</span>: <span id="remCount" class="text-blue-500">10</span> Left
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-10">
        
        <!-- BANNER AD: SANDBOXED TO PREVENT REDIRECTS -->
        <div class="ad-wrapper">
            <iframe 
                id="ad-frame"
                style="width:728px; height:90px; border:none; background:transparent;" 
                sandbox="allow-scripts allow-popups allow-same-origin"
                srcdoc="
                <body style='margin:0; display:flex; justify-content:center; align-items:center;'>
                    <script type='text/javascript'>
                        atOptions = {
                            'key' : 'fea6acbdcf0fdca6a97f3460a737e593',
                            'format' : 'iframe',
                            'height' : 90,
                            'width' : 728,
                            'params' : {}
                        };
                    </script>
                    <script type='text/javascript' src='https://www.highperformanceformat.com/fea6acbdcf0fdca6a97f3460a737e593/invoke.js'></script>
                </body>">
            </iframe>
        </div>

        <h1 class="text-4xl md:text-6xl font-extrabold text-center mb-10 leading-none tracking-tighter">AI Prompt <span class="text-blue-500">Engineer</span></h1>

        <!-- CATEGORIES -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-10">
            <div onclick="setCat('chatgpt')" id="card-chatgpt" class="glass p-5 rounded-2xl cursor-pointer active-card text-center font-bold">ChatGPT</div>
            <div onclick="setCat('midjourney')" id="card-midjourney" class="glass p-5 rounded-2xl cursor-pointer text-center font-bold">Images</div>
            <div onclick="setCat('coding')" id="card-coding" class="glass p-5 rounded-2xl cursor-pointer text-center font-bold">Coding</div>
            <div onclick="setCat('marketing')" id="card-marketing" class="glass p-5 rounded-2xl cursor-pointer text-center font-bold">Marketing</div>
        </div>

        <!-- INPUT BOX -->
        <div class="glass p-2 rounded-[2.5rem] overflow-hidden mb-10 shadow-2xl">
            <textarea id="userInput" placeholder="What's your idea?" class="w-full h-44 bg-transparent p-8 text-xl outline-none resize-none placeholder:text-slate-800"></textarea>
            <div class="p-4 bg-white/5 border-t border-white/5 flex justify-end">
                <button onclick="generate()" class="bg-blue-600 hover:bg-blue-500 text-white px-10 py-3 rounded-2xl font-bold transition shadow-lg shadow-blue-600/20">
                    Generate Prompt ✨
                </button>
            </div>
        </div>

        <!-- RESULT SECTION -->
        <div id="resultBox" class="hidden glass p-8 rounded-[2rem] border-blue-500/20 shadow-2xl animate-pulse">
            <div id="output" class="text-lg text-slate-200 italic leading-relaxed mb-6"></div>
            <button onclick="copyText()" class="text-blue-500 font-bold text-sm uppercase tracking-widest">Copy Master Prompt</button>
        </div>
    </main>

    <script>
        // APNA DIRECT LINK YAHAN PASTE KAREIN
        const MY_DIRECT_LINK = "https://www.effectivegatecpm.com/hx9eqwb2?key=eca9ef1a642f0854c04b34a426523a34";

        let currentCat = 'chatgpt';
        let userLimits = JSON.parse(localStorage.getItem('user_limits_vfinal')) || {
            date: new Date().toLocaleDateString(),
            chatgpt: 0, midjourney: 0, coding: 0, marketing: 0
        };

        function setCat(cat) {
            currentCat = cat;
            document.querySelectorAll('[id^="card-"]').forEach(c => c.classList.remove('active-card'));
            document.getElementById('card-' + cat).classList.add('active-card');
            document.getElementById('activeCat').innerText = cat.toUpperCase();
            document.getElementById('remCount').innerText = 10 - userLimits[currentCat];
        }

        function generate() {
            if(userLimits[currentCat] >= 10) {
                document.getElementById('adModal').style.display = 'flex';
                return;
            }
            const input = document.getElementById('userInput').value;
            if(!input) return;

            document.getElementById('output').innerText = `[EXPERT ${currentCat.toUpperCase()}]: ${input}. (Highly optimized with technical frameworks and professional personas for AI excellence)`;
            document.getElementById('resultBox').classList.remove('hidden');

            userLimits[currentCat]++;
            localStorage.setItem('user_limits_vfinal', JSON.stringify(userLimits));
            document.getElementById('remCount').innerText = 10 - userLimits[currentCat];
        }

        function watchAdToUnlock() {
            window.open(MY_DIRECT_LINK, '_blank'); 
            userLimits[currentCat] = 0;
            localStorage.setItem('user_limits_vfinal', JSON.stringify(userLimits));
            document.getElementById('adModal').style.display = 'none';
            document.getElementById('remCount').innerText = 10;
        }

        function closeModal() { document.getElementById('adModal').style.display = 'none'; }
        function copyText() { navigator.clipboard.writeText(document.getElementById('output').innerText); alert("Prompt Copied!"); }
    </script>
</body>
</html>
